name: Publish to npm

# Run manually from the Actions tab ("Run workflow").
# Publishes the version in package.json and fails if that version is already on npm.
# Authenticates with npm Trusted Publishing (OIDC): no token or secret is needed, but the
# package must list this repository and workflow (publish.yml) as its trusted publisher on npmjs.com.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (and provenance)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only release what is on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Latest patch release: older ones have CVE-2026-111497 (Node2Shell).
          check-latest: true
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: |
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@^11.5.1
          fi
          npm --version

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fail if the version is already published
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # npm view exits non-zero with E404 when the package or version does not exist.
          if published=$(npm view "$NAME@$VERSION" version 2>/dev/null) && [ "$published" = "$VERSION" ]; then
            echo "::error title=Version already published::$NAME@$VERSION already exists on npm. Bump \"version\" in package.json and try again."
            exit 1
          fi
          echo "$NAME@$VERSION is not on npm yet; continuing."

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish
        # Trusted Publishing signs provenance automatically. Checks already ran, so skip prepublishOnly.
        run: npm publish --access public --ignore-scripts

      - name: Summary
        run: echo "Published ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} → https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
