name: Docs

# Builds the documentation site (VitePress + TypeDoc) and publishes it to GitHub Pages.
# Every example in the guides is executed and its output compared with the
# documented one, so the build fails if the docs drift from the library.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Latest patch release: older ones have CVE-2026-111497 (Node2Shell).
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json

      # The examples import the library from src/ and need its optional dependencies.
      - run: npm ci
      - run: npm ci
        working-directory: docs

      - run: npm run build
        working-directory: docs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
